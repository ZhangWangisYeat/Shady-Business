[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shady-business-backend"
version = "0.1.0"
description = "UCLA pedestrian routing with explicitly sourced shade status"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3",
  "networkx>=3.3,<4", "shapely>=2.0,<3", "pyproj>=3.6,<4", "astral>=3.2,<4"
]

[project.optional-dependencies]
ingest = ["osmnx>=2.0,<3", "geopandas>=1.0,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
